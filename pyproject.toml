[project]
name = "cat-printer"
version = "0.6.3.0"
description = "🐱🖨 A project that provides support to some Bluetooth “Cat Printer” models"

authors = [
    { name = "NaitLee", email = "naitli@foxmail.com" }
]

dependencies = [
    "bleak~=0.20.2",
    "pyobjc~=9.1.1; sys_platform == 'darwin'",
]
readme = "README.md"
requires-python = ">= 3.8"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cat-printer = "printer:main"
cat-printer-server = "server:serve"

# Flat layout: scripts live at the repo root, not in a cat_printer/ package.
# uvx --from git+... still builds a wheel, so Hatchling needs an explicit file list.
[tool.hatch.build.targets.wheel]
only-include = [
    "printer.py",
    "server.py",
    "main.py",
    "printer_lib",
    "www",
    "i18n.i18n",
    "config.json",
]

[tool.uv]
package = false
